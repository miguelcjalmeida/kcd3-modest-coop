name: Release ItemSwapAgent

# Builds ItemSwapAgent for Windows and Linux, and packages the mod itself,
# on every push to main - publishing all three as a GitHub Release so
# friends always have ready-to-use downloads without needing the .NET SDK
# or PowerShell installed themselves.
#
# Versioning: agent/version.txt is the single source of truth (read by both
# csproj files into <Version>, which is what makes the exe print its own
# version at startup). The release tag is v<that version> - pushing again
# without bumping version.txt just updates that same release's files rather
# than failing or creating a duplicate, so "push and get a build" works
# either way.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Read version
        id: version
        run: echo "version=$(cat agent/version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # dotnet publish can cross-compile both RIDs from this one Linux
      # runner - no need for a Windows runner just to produce a win-x64 exe.
      - name: Publish win-x64
        run: >
          dotnet publish agent/ItemSwapAgent/ItemSwapAgent.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish/win-x64

      - name: Publish linux-x64
        run: >
          dotnet publish agent/ItemSwapAgent/ItemSwapAgent.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish/linux-x64

      - name: Zip agent artifacts
        run: |
          cd publish/win-x64 && zip -r ../../ItemSwapAgent-win-x64.zip . && cd -
          cd publish/linux-x64 && zip -r ../../ItemSwapAgent-linux-x64.zip . && cd -

      # Mirrors tools/Build-And-Install-Mod.ps1's layout exactly, so
      # extracting this zip at the root of a KCD2 install drops the mod
      # straight into place with no PowerShell/dotnet needed on their end.
      # itemswap.pak specifically must be stored (zip -0), not deflated -
      # that's what CryEngine's pak reader expects; the outer mod.zip itself
      # can compress normally since it's just a plain zip a person extracts.
      - name: Package mod
        run: |
          mkdir -p mod-package/Mods/itemswap/Data
          (cd mod/Data && zip -r -X -0 ../../mod-package/Mods/itemswap/Data/itemswap.pak .)
          cp mod/mod.manifest mod-package/Mods/itemswap/mod.manifest
          (cd mod-package && zip -r ../mod.zip Mods)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ItemSwapAgent v${{ steps.version.outputs.version }}
          files: |
            ItemSwapAgent-win-x64.zip
            ItemSwapAgent-linux-x64.zip
            mod.zip
